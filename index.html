<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Access | Something Big is Coming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a; /* Sleek dark background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 40px 20px;
        }
        .badge {
            background-color: rgba(138, 75, 222, 0.15);
            color: #8A4BDE; /* The extracted purple */
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        h1 span {
            color: #8A4BDE;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input:focus {
            border-color: #8A4BDE;
        }
        button {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: none;
            background-color: #8A4BDE;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        button:hover {
            background-color: #743bc4;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Invite Only</div>
        <!-- Replace with your actual value proposition -->
        <h1>The way we do things is <span>changing.</span></h1>
        <p>Be the first to know when we launch. Join the waitlist today to secure your exclusive founding member perks.</p>
        
                <form id="earlyAccessForm">
            <input type="text" name="Name" placeholder="Your Full Name" required>
            <input type="email" name="Email" placeholder="your@email.com" required>
            
            <!-- Kept optional to save conversion rates -->
            <input type="tel" name="Phone Number" placeholder="Phone Number (Optional)">
            
            <select name="Exam Prep" style="width: 100%; padding: 16px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #fff; font-size: 1rem; outline: none; margin-bottom: 16px; appearance: none;" required>
                <option value="" disabled selected>Which exam are you preparing for?</option>
                <option value="UPSC">UPSC</option>
                <option value="APSC">APSC / State PSC</option>
                <option value="SSC/Banking">SSC / Banking</option>
                <option value="JEE/NEET">JEE / NEET</option>
                <option value="Other">Other</option>
            </select>

            <input type="text" name="Location" placeholder="City (e.g., Guwahati)" required>
            
            <button type="submit" id="submitBtn">Get Early Access</button>
        </form>
        <p class="footer-text" id="statusMessage">No spam. Unsubscribe anytime.</p>
    </div>

    <script>
        // We will plug in the Google Apps Script Web App URL here
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        const form = document.getElementById('earlyAccessForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.innerText = 'Joining waitlist...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    form.reset();
                    statusMessage.innerText = 'You are on the list! Keep an eye on your inbox.';
                    statusMessage.style.color = '#10b981'; // Success green
                    submitBtn.innerText = 'Get Early Access';
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    statusMessage.innerText = 'Something went wrong. Please try again.';
                    statusMessage.style.color = '#ef4444'; // Error red
                    submitBtn.innerText = 'Get Early Access';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
