<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Early Access | Assam Govt Job Prep</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a; /* Sleek dark background */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 40px 20px;
        }
        .badge {
            background-color: rgba(138, 75, 222, 0.15);
            color: #8A4BDE; /* The extracted purple */
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 16px;
            line-height: 1.2;
        }
        h1 span {
            color: #8A4BDE;
        }
        p {
            color: #94a3b8;
            font-size: 1.05rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input[type="text"], input[type="email"], input[type="tel"], select {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        select {
            appearance: none;
            cursor: pointer;
        }
        input:focus, select:focus {
            border-color: #8A4BDE;
        }
        /* Style for the select dropdown options to ensure they are legible */
        option {
            background-color: #1e293b;
            color: #fff;
        }
        button {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: none;
            background-color: #8A4BDE;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 8px;
        }
        button:hover {
            background-color: #743bc4;
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 16px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Assam Exclusive</div>
        <h1>Crack your next exam. <span>Smarter.</span></h1>
        <p>We are building the ultimate tool for Assam govt job aspirants. Join the waitlist to get exclusive early access and founding member perks.</p>
        
        <form id="earlyAccessForm">
            <!-- Ensure these 'name' attributes perfectly match your Google Sheet headers -->
            <input type="text" name="Name" placeholder="Your Full Name" required>
            <input type="email" name="Email" placeholder="your@email.com" required>
            <input type="tel" name="Phone Number" placeholder="WhatsApp Number (Optional)">
            
            <select name="Exam Prep" required>
                <option value="" disabled selected>Which exam are you targeting?</option>
                <option value="Assam Direct Recruitment (ADRE)">Assam Direct Recruitment (ADRE)</option>
                <option value="APSC CCE">APSC CCE</option>
                <option value="Assam Police (SI / Constable)">Assam Police (SI / Constable)</option>
                <option value="Assam TET / D.El.Ed">Assam TET / D.El.Ed</option>
                <option value="PNRD / DME / Others">PNRD / DME / Other Depts</option>
            </select>

            <input type="text" name="Location" placeholder="Your City/District (e.g., Guwahati)" required>
            
            <button type="submit" id="submitBtn">Get Early Access</button>
        </form>
        <p class="footer-text" id="statusMessage">No spam. Unsubscribe anytime.</p>
    </div>

    <script>
        // CRITICAL: Replace this with your newly deployed Web App URL
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
        const form = document.getElementById('earlyAccessForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.innerText = 'Joining waitlist...';
            submitBtn.disabled = true;

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    form.reset();
                    statusMessage.innerText = 'You are on the list! Keep an eye on your inbox.';
                    statusMessage.style.color = '#10b981'; // Success green
                    submitBtn.innerText = 'Get Early Access';
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    statusMessage.innerText = 'Something went wrong. Please try again.';
                    statusMessage.style.color = '#ef4444'; // Error red
                    submitBtn.innerText = 'Get Early Access';
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
